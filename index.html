<style>
  :root{
    --nuit:#070B12; --abysse:#0E1626; --trait:#1D2A3F; --ivoire:#E8ECF2; --brume:#8C98AB; --dim:#5E6A7D;
    --meridien:#5B8CFF; --meridien-2:#8FB1FF; --champagne:#D6BE8A;
    --serif:'Playfair Display',Georgia,serif; --sans:'Inter',system-ui,-apple-system,sans-serif;
    --gouttiere:clamp(20px,5vw,72px);
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%; scroll-behavior:smooth}
  html,body{margin:0}
  body{font-variant-numeric:lining-nums; background:var(--nuit); color:var(--ivoire); font:400 16px/1.6 var(--sans); -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility}
  [dir="rtl"] body{font-family:'Cairo',var(--sans)}
  a{color:inherit}
  :focus-visible{outline:2px solid var(--meridien); outline-offset:3px; border-radius:2px}
  ::selection{background:rgba(91,140,255,.35)}
  .conteneur{max-width:1240px; margin:0 auto; padding:0 var(--gouttiere)}

  /* En-tête */
  .entete{position:absolute; inset:0 0 auto; z-index:5}
  .entete .conteneur{display:flex; align-items:center; justify-content:space-between; gap:16px; height:76px}
  .marque{display:flex; align-items:center; gap:12px; font:700 15px/1 var(--serif); letter-spacing:.16em; text-decoration:none}
  .actions{display:flex; align-items:center; gap:10px}
  .lien-discret{font-size:14px; color:var(--brume); text-decoration:none; padding:10px 12px; transition:color .2s}
  .lien-discret:hover{color:var(--ivoire)}
  .langue{position:relative; display:inline-flex; align-items:center; border:1px solid var(--trait); border-radius:999px; padding:0 12px; height:36px; color:var(--brume); transition:border-color .2s}
  .langue:hover{border-color:#2f4262}
  .langue select{appearance:none; background:none; border:0; color:var(--ivoire); font:500 13px var(--sans); padding:0 16px 0 0; cursor:pointer; outline:none}
  [dir="rtl"] .langue select{padding:0 0 0 16px}
  .langue select option{background:var(--abysse)}
  .langue svg{position:absolute; right:12px; pointer-events:none}
  [dir="rtl"] .langue svg{right:auto; left:12px}

  /* Hero */
  .hero{position:relative; min-height:100svh; display:flex; align-items:center; overflow:hidden; padding:110px 0 70px;
    background:radial-gradient(90% 70% at 72% 40%, #12203a 0%, rgba(7,11,18,0) 62%), var(--nuit)}
  .hero::after{content:""; position:absolute; inset:auto 0 0; height:160px; background:linear-gradient(to bottom, rgba(7,11,18,0), var(--nuit)); pointer-events:none}
  .hero .conteneur{position:relative; z-index:1; display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.05fr); align-items:center; gap:clamp(24px,4vw,64px); width:100%}
  .chapeau{color:var(--meridien-2); font-size:15px; margin:0 0 22px}
  .titre{font:700 clamp(50px,6.6vw,96px)/.95 var(--serif); white-space:nowrap; letter-spacing:.035em; margin:0 0 28px}
  [dir="rtl"] .titre{letter-spacing:.02em}
  .accroche{text-wrap:pretty; font-size:clamp(18px,1.7vw,21px); line-height:1.6; color:#C9D1DD; max-width:31em; margin:0 0 38px}
  .boutons{display:flex; flex-wrap:wrap; gap:12px}
  .bouton{display:inline-flex; align-items:center; justify-content:center; height:52px; padding:0 28px; border-radius:3px; font:600 15px var(--sans); text-decoration:none; transition:background-color .2s, border-color .2s, transform .2s}
  .bouton-plein{background:var(--meridien); color:#060A12}
  .bouton-plein:hover{background:var(--meridien-2)}
  .bouton-plein:active{transform:translateY(1px)}
  .bouton-ligne{border:1px solid #2a3a55; color:var(--ivoire)}
  .bouton-ligne:hover{border-color:var(--meridien)}
  .statut{margin-top:44px; max-width:420px}
  .statut[hidden]{display:none}
  .jauge{height:2px; background:var(--trait); border-radius:2px; overflow:hidden}
  .jauge span{display:block; height:100%; width:0; background:linear-gradient(90deg,var(--meridien),var(--champagne)); transition:width 1.6s cubic-bezier(.2,.7,.2,1) .4s}
  .statut p{margin:12px 0 0; font-size:14px; color:var(--brume)}
  .statut strong{color:var(--ivoire); font-weight:600}
  .scene{position:relative; aspect-ratio:1/1; width:100%; max-width:640px; justify-self:end}
  [dir="rtl"] .scene{justify-self:start}
  .scene canvas{position:absolute; inset:0; width:100%; height:100%}

  /* Entrée orchestrée (un seul moment) */
  @keyframes monte{from{opacity:0; transform:translateY(18px)}to{opacity:1; transform:none}}
  @keyframes eclot{from{opacity:0; transform:scale(.94)}to{opacity:1; transform:none}}
  .hero .texte > *{animation:monte 1s cubic-bezier(.2,.7,.2,1) both}
  .hero .texte > :nth-child(2){animation-delay:.08s}
  .hero .texte > :nth-child(3){animation-delay:.18s}
  .hero .texte > :nth-child(4){animation-delay:.28s}
  .hero .texte > :nth-child(5){animation-delay:.38s}
  .scene{animation:eclot 1.8s cubic-bezier(.2,.7,.2,1) .1s both}

  /* Sections */
  section.bloc{padding:clamp(80px,11vw,140px) 0; border-top:1px solid var(--trait)}
  h2{font:600 clamp(30px,3.6vw,44px)/1.15 var(--serif); font-variant-numeric:lining-nums; margin:0 0 14px; letter-spacing:.005em}
  .intro{text-wrap:pretty; color:var(--brume); font-size:17px; max-width:36em; margin:0 0 56px}
  .garanties{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:48px 72px; margin:0; padding:0; list-style:none}
  .garanties li{display:grid; grid-template-columns:44px 1fr; gap:4px 18px}
  .garanties svg{grid-row:span 2; margin-top:2px}
  .garanties h3{font:600 19px/1.35 var(--sans); margin:0}
  .garanties p{text-wrap:pretty; margin:4px 0 0; color:var(--brume); font-size:15.5px; max-width:30em}

  .etapes{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:32px; margin:0; padding:0; list-style:none; counter-reset:etape}
  .etapes li{position:relative; padding-top:28px; border-top:1px solid var(--trait); counter-increment:etape}
  .etapes li::before{content:counter(etape); position:absolute; top:-14px; left:0; width:28px; height:28px; border-radius:50%; background:var(--nuit); border:1px solid #2f4262; color:var(--meridien-2); font:600 13px/26px var(--sans); text-align:center}
  [dir="rtl"] .etapes li::before{left:auto; right:0}
  .etapes h3{font:600 18px/1.35 var(--sans); margin:0 0 6px}
  .etapes p{margin:0; color:var(--brume); font-size:15px}

  .fondateur .conteneur{display:grid; grid-template-columns:minmax(0,1.2fr) minmax(0,.8fr); gap:clamp(32px,6vw,96px); align-items:center}
  .certificat{position:relative; padding:clamp(28px,4vw,48px); border:1px solid rgba(214,190,138,.35); outline:1px solid rgba(214,190,138,.14); outline-offset:6px; background:linear-gradient(160deg, rgba(214,190,138,.06), rgba(14,22,38,.4) 55%)}
  .prix{font:600 clamp(40px,5vw,60px)/1 var(--serif); font-variant-numeric:lining-nums; margin:18px 0 6px}
  .prix span{unicode-bidi:isolate; direction:ltr; display:inline-block}
  .prix small{font:500 16px var(--sans); color:var(--brume); margin-left:6px}
  [dir="rtl"] .prix small{margin:0 6px 0 0}
  .apres{color:var(--brume); font-size:15px; margin:0 0 28px}
  .certificat .statut{margin:0 0 30px}
  .sceau{justify-self:center; width:min(300px,70vw)}
  .sceau text{font:600 9px var(--sans); fill:var(--champagne)}
  @keyframes tourne{to{transform:rotate(360deg)}}
  .sceau .anneau{transform-origin:100px 100px; animation:tourne 90s linear infinite}

  .pied{border-top:1px solid var(--trait); padding:36px 0 44px; color:var(--dim); font-size:13.5px}
  .pied .conteneur{display:flex; flex-wrap:wrap; justify-content:space-between; gap:14px 24px}
  .pied nav{display:flex; flex-wrap:wrap; gap:8px 22px}
  .pied a{color:var(--brume); text-decoration:none}
  .pied a:hover{color:var(--ivoire)}

  @media (max-width:900px){
    .hero{min-height:auto; padding:96px 0 56px}
    .hero .conteneur{grid-template-columns:1fr}
    .scene{order:-1; max-width:440px; justify-self:center; margin:-8px auto -36px}
    .garanties{grid-template-columns:1fr; gap:36px}
    .etapes{grid-template-columns:1fr 1fr; gap:44px 28px}
    .fondateur .conteneur{grid-template-columns:1fr}
    .sceau{order:-1; width:200px}
  }
  @media (max-width:520px){
    .lien-discret{display:none}
    .etapes{grid-template-columns:1fr}
    .boutons .bouton{flex:1 1 100%}
  }
  @media (prefers-reduced-motion:reduce){
    html{scroll-behavior:auto}
    .hero .texte > *, .scene{animation:none}
    .sceau .anneau{animation:none}
    .jauge span{transition:none}
  }
</style>
</head>
